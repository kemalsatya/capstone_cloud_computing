global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: journalfit-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000
        labels:
          environment: local-compose
      - targets:
          - journalfit.localhost:8088
        labels:
          environment: k3d-ingress

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
