global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: journalfit-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:9100
        labels:
          environment: local-compose
      # For k3d, port-forward journalfit-backend:9100 to the host first.
      - targets:
          - host.docker.internal:9100
        labels:
          environment: k3d-port-forward

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
