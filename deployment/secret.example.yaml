# Placeholder secret shape for the backend. Do not commit real values.
# Create the real Secret imperatively (see source/instructions/README_KEYCLOAK_AUTH.md):
#   kubectl -n default create secret generic journalfit-backend-secret \
#     --from-literal=DB_PASSWORD='<db-password>'
apiVersion: v1
kind: Secret
metadata:
  name: journalfit-backend-secret
  namespace: default
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_WITH_LOCAL_SECRET"
---
# AI provider key for worker-scope. Required only when AI_MODE=groq.
apiVersion: v1
kind: Secret
metadata:
  name: journalfit-ai-secret
  namespace: default
type: Opaque
stringData:
  GROQ_API_KEY: "REPLACE_WITH_GROQ_KEY"
