apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: journalfit-backend
  namespace: capstone
spec:
  ingressClassName: traefik
  rules:
    - host: journalfit.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: journalfit-backend
                port:
                  number: 80
