apiVersion: apps/v1
kind: Deployment
metadata:
  name: journalfit-worker-format
  namespace: default
  labels:
    app: journalfit-worker-format
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: journalfit-worker-format
  template:
    metadata:
      labels:
        app: journalfit-worker-format
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        journalfit-storage: uploads
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker-format
          image: registry:5000/journalfit-backend:2dc3593
          imagePullPolicy: Always
          command: ["node", "src/worker.js"]
          envFrom:
            - configMapRef:
                name: journalfit-backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: journalfit-backend-secret
                  key: DB_PASSWORD
            - name: WORKER_TYPE
              value: format
          ports:
            - name: metrics
              containerPort: 9101
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: journalfit-uploads
