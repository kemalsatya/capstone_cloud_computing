apiVersion: v1
kind: ConfigMap
metadata:
  name: journalfit-backend-config
  namespace: default
data:
  NODE_ENV: production
  PORT: "8000"
  # host.k3d.internal points to the Docker host gateway. k3d v5.9 may not inject
  # it automatically; create-cluster.sh passes --host-alias and existing clusters
  # can run automation/scripts/fix-k3d-host-alias.sh.
  # host.docker.internal is Docker Desktop-only.
  DB_HOST: host.k3d.internal
  DB_PORT: "5432"
  DB_USER: capstone
  DB_NAME: journalfit
  AUTH_MODE: jwt
  # Must equal the Keycloak service KC_HOSTNAME (external issuer URL).
  KEYCLOAK_ISSUER: http://keycloak.localhost:8088/realms/journalfit
  # In-cluster JWKS fetch: the issuer above is not resolvable from pods.
  KEYCLOAK_JWKS_URI: http://keycloak.default.svc.cluster.local/realms/journalfit/protocol/openid-connect/certs
  KEYCLOAK_AUDIENCE: journalfit-api
  MAX_UPLOAD_MB: "10"
  UPLOAD_DIR: /app/uploads
  PG_BOSS_SCHEMA: pgboss
  FORMAT_QUEUE: format-check
  SCOPE_QUEUE: scope-check
  WORKER_METRICS_PORT: "9101"
  # Set to "true" only for a demo; exposes /docs and /openapi.yaml.
  ENABLE_DOCS: "true"
  # mock/groq
  AI_MODE: mock
  GROQ_MODEL: openai/gpt-oss-20b
  GROQ_BASE_URL: https://api.groq.com/openai/v1
  AI_TIMEOUT_MS: "30000"
  AI_PRICE_IN_PER_1M: "0"
  AI_PRICE_OUT_PER_1M: "0"
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://garage:3900
  S3_BUCKET: journalfit-manuscripts
  S3_REGION: garage
  S3_FORCE_PATH_STYLE: "true"
  METRICS_PUBLIC: "false"
  METRICS_PORT: "9100"
