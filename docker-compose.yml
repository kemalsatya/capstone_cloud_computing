name: journalfit-platform

services:
  # ===============================================================
  # 1. CORE APPLICATION & DATABASE (Default Profile: Local Dev)
  # ===============================================================
  postgres:
    image: postgres:17-alpine
    container_name: journalfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-journalfit}
      POSTGRES_USER: ${DB_USER:-capstone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-capstone}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./source/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./source/migrations/001_add_keycloak_auth.sql:/docker-entrypoint-initdb.d/02-auth.sql:ro
      - ./source/migrations/002_prd_format_foundation.sql:/docker-entrypoint-initdb.d/03-format.sql:ro
      - ./source/migrations/003_tenant_admin.sql:/docker-entrypoint-initdb.d/04-tenant.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-capstone} -d ${DB_NAME:-journalfit}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - capstone-net

  # One-shot setup: migrations then demo seed, using the app image.
  # The postgres init scripts above only run on an empty volume, so older
  # volumes still need this job to receive 001/002/003.
  db-setup:
    build:
      context: ./source
      dockerfile: Dockerfile
    container_name: journalfit-db-setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:-capstone}
      DB_NAME: ${DB_NAME:-journalfit}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      UPLOAD_DIR: uploads
    command:
      - sh
      - -c
      - |
        node scripts/ensure-keycloak-db.js &&
        node scripts/run-migrations.js &&
        node scripts/seed-demo-data.js
    restart: "no"
    networks:
      - capstone-net

  app:
    build:
      context: ./source
      dockerfile: Dockerfile
    container_name: journalfit-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      garage:
        condition: service_started
      db-setup:
        condition: service_completed_successfully
    environment:
      PORT: ${PORT:-8000}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:-capstone}
      DB_NAME: ${DB_NAME:-journalfit}
      AUTH_MODE: ${AUTH_MODE:-jwt}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:${KEYCLOAK_PORT:-8081}/realms/journalfit}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/journalfit/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-journalfit-api}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      UPLOAD_DIR: uploads
      PG_BOSS_SCHEMA: ${PG_BOSS_SCHEMA:-pgboss}
      FORMAT_QUEUE: ${FORMAT_QUEUE:-format-check}
      SCOPE_QUEUE: ${SCOPE_QUEUE:-scope-check}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-journalfit-manuscripts}
      S3_REGION: ${S3_REGION:-garage}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-journalfit}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-journalfit-secret}
      METRICS_PUBLIC: ${METRICS_PUBLIC:-true}
      METRICS_PORT: 9100
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
      - "127.0.0.1:${API_METRICS_PORT:-9100}:9100"
    volumes:
      - app_uploads:/app/uploads
    networks:
      - capstone-net

  worker-format:
    build:
      context: ./source
      dockerfile: Dockerfile
    container_name: journalfit-worker-format
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      db-setup:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:-capstone}
      DB_NAME: ${DB_NAME:-journalfit}
      UPLOAD_DIR: uploads
      PG_BOSS_SCHEMA: ${PG_BOSS_SCHEMA:-pgboss}
      FORMAT_QUEUE: ${FORMAT_QUEUE:-format-check}
      SCOPE_QUEUE: ${SCOPE_QUEUE:-scope-check}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-journalfit-manuscripts}
      S3_REGION: ${S3_REGION:-garage}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-journalfit}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-journalfit-secret}
      WORKER_TYPE: format
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9101}
    command: ["node", "src/worker.js"]
    ports:
      - "127.0.0.1:${WORKER_METRICS_PORT:-9101}:9101"
    volumes:
      - app_uploads:/app/uploads
    networks:
      - capstone-net

  worker-scope:
    build:
      context: ./source
      dockerfile: Dockerfile
    container_name: journalfit-worker-scope
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:-capstone}
      DB_NAME: ${DB_NAME:-journalfit}
      PG_BOSS_SCHEMA: ${PG_BOSS_SCHEMA:-pgboss}
      SCOPE_QUEUE: ${SCOPE_QUEUE:-scope-check}
      WORKER_TYPE: scope
      WORKER_METRICS_PORT: 9101
      AI_MODE: ${AI_MODE:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_PRICE_IN_PER_1M: ${AI_PRICE_IN_PER_1M:-0}
      AI_PRICE_OUT_PER_1M: ${AI_PRICE_OUT_PER_1M:-0}
    command: ["node", "src/worker.js"]
    ports:
      - "127.0.0.1:${WORKER_SCOPE_METRICS_PORT:-9102}:9101"
    networks:
      - capstone-net

  garage:
    image: dxflrs/garage:v2.6.0
    container_name: journalfit-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Docker Desktop mounts secrets world-readable; this is dev-only.
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-journalfit}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-journalfit-secret}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-journalfit-manuscripts}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./deployment/garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    secrets:
      - garage_rpc_secret
    networks:
      - capstone-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: capstone-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${DB_USER:-capstone}
      KC_DB_PASSWORD: ${DB_PASSWORD:-capstone}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deployment/keycloak/realm-journalfit.json:/opt/keycloak/data/import/realm-journalfit.json:ro
    networks:
      - capstone-net

  # ===============================================================
  # 2. CI/CD & REGISTRY INFRASTRUCTURE (Profile: ci-cd)
  # ===============================================================
  registry:
    image: registry:2
    container_name: capstone-registry
    profiles: ["ci-cd"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5001}:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      capstone-net:
        aliases:
          - registry

  gitea:
    image: gitea/gitea:${GITEA_VERSION:-1.22}
    container_name: capstone-gitea
    profiles: ["ci-cd"]
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:${GITEA_PORT:-3001}/
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__SSH_PORT: "${GITEA_SSH_PORT:-2222}"
      GITEA__actions__ENABLED: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_PRIVATE: "false"
    ports:
      - "127.0.0.1:${GITEA_PORT:-3001}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea_data:/data
    networks:
      - capstone-net

  # ===============================================================
  # 3. OBSERVABILITY INFRASTRUCTURE (Profile: observability)
  # ===============================================================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: capstone-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=3d"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "journalfit.localhost:host-gateway"
    volumes:
      - ./evidence/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - capstone-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: capstone-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./evidence/observability/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - capstone-net

networks:
  capstone-net:
    name: capstone-net

secrets:
  garage_rpc_secret:
    file: ./deployment/garage/rpc_secret.example

volumes:
  postgres_data:
  app_uploads:
  garage_data:
  registry_data:
  gitea_data:
  prometheus_data:
  grafana_data:
