apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone-app
  namespace: capstone
spec:
  rules:
    - host: capstone.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capstone-app
                port:
                  number: 80
