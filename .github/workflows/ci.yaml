name: Capstone CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Node.js Test & Sanity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install Dependencies
        run: |
          cd source
          npm ci

      - name: Execute Tests
        run: |
          cd source
          npm test

  build-scan-artifact:
    name: Build Immutable Container & Scan
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Immutable Tag Metadata
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "COMMIT_SHA=${SHA}" >> $GITHUB_ENV
          echo "IMAGE_NAME=journalfit-backend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (Node.js Express)
        run: |
          set -euo pipefail
          DOCKERFILE_PATH="source/Dockerfile"
          if [ ! -f "$DOCKERFILE_PATH" ] && [ -f "deployment/Dockerfile" ]; then
            DOCKERFILE_PATH="deployment/Dockerfile"
          fi

          if [ -f "$DOCKERFILE_PATH" ]; then
            echo "[INFO] Building container image from $DOCKERFILE_PATH..."
            docker build -t "journalfit-backend:${{ env.COMMIT_SHA }}" -f "$DOCKERFILE_PATH" ./source
          else
            echo "[NOTICE] Dockerfile not yet authored by Anggota 2."
            echo "[NOTICE] Building lightweight Node.js stub image to keep CI delivery verified..."
            docker build -t "journalfit-backend:${{ env.COMMIT_SHA }}" - << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY source/package*.json ./
          RUN npm ci --omit=dev
          COPY source/src ./src
          USER node
          EXPOSE 8000
          CMD ["node", "src/index.js"]
          EOF
          fi

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'journalfit-backend:${{ env.COMMIT_SHA }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
