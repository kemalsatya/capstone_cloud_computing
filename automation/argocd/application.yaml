apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: journalfit-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kemalsatya/capstone_cloud_computing.git
    # Review branch first; use main/HEAD only after the platform PR is merged.
    targetRevision: feat/k8s-manifests
    path: deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: journalfit-backend
      namespace: default
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    # Disabled until the source branch is published and its rendered resources reviewed.
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
