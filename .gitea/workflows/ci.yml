name: capstone-gitea-ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-scan-publish:
    runs-on: capstone
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tool Versions Check
        run: |
          node --version || true
          npm --version || true
          docker version

      - name: Start Test PostgreSQL
        run: |
          set -euo pipefail
          docker rm -f journalfit-test-postgres || true
          docker run -d --name journalfit-test-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=journalfit_test \
            -p 55432:5432 \
            postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec journalfit-test-postgres pg_isready -U postgres -d journalfit_test; then
              exit 0
            fi
            sleep 1
          done
          echo "[ERROR] PostgreSQL test container tidak siap." >&2
          exit 1

      - name: Verify Application Code (Node.js Test)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/journalfit_test
        run: |
          set -euo pipefail
          if [ -f "source/package.json" ]; then
            cd source
            npm ci
            npm test
          else
            echo "[NOTICE] source/package.json is missing."
          fi

      - name: Stop Test PostgreSQL
        if: always()
        run: docker rm -f journalfit-test-postgres || true

      - name: Build, Scan, and Tag Immutable Container Artifact
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=7 HEAD)"
          PUSH_IMAGE="localhost:5001/journalfit-backend:${SHA}"

          if [ -f "source/Dockerfile" ]; then
            docker build -t "$PUSH_IMAGE" -f source/Dockerfile ./source
          elif [ -f "deployment/Dockerfile" ]; then
            docker build -t "$PUSH_IMAGE" -f deployment/Dockerfile .
          else
            echo "[NOTICE] Dockerfile is in progress by Anggota 2. Building Node.js container image."
            docker build -t "$PUSH_IMAGE" - << 'EOF'
          FROM node:22-alpine
          WORKDIR /app
          COPY source/package*.json ./
          RUN npm ci --omit=dev || npm install --omit=dev
          COPY source/src ./src
          USER node
          EXPOSE 8000
          CMD ["node", "src/index.js"]
          EOF
          fi

          # Scan with local Trivy runner
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 0 "$PUSH_IMAGE" || true

          # Push to local registry
          docker push "$PUSH_IMAGE" || echo "[WARN] Local registry push skipped if registry not online."
