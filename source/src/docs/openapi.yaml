  responses:
    UnprocessableEntity:
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ruleInvalid:
              value:
                error:
                  code: RULE_INVALID
                  message: Rule tidak dikenal FMT-999.
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11

    InvalidQuery:
      description: Invalid query parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidQuery:
              value:
                error:
                  code: INVALID_QUERY
                  message: "Parameter 'status' tidak valid."
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11

    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Authorization bearer token is required.
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11

    Forbidden:
      description: |
        The role is not allowed, or the token is missing a recognized tenant
        claim. `X-Tenant-ID` is not used when a JWT is present.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: You do not have permission to perform this action.
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11
            tenantClaimMissing:
              value:
                error:
                  code: TENANT_CLAIM_MISSING
                  message: Access token is missing the tenant_id claim.
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11

    NotFound:
      description: |
        Resource not found in the caller's tenant. Cross-tenant access
        intentionally returns `404` to avoid disclosing existence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            crossTenant:
              value:
                error:
                  code: NOT_FOUND
                  message: "Manuscript with ID 'ms-001' not found"
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11

    BadRequest:
      description: Missing file or invalid DOCX.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidFile:
              value:
                error:
                  code: INVALID_FILE
                  message: Berkas bukan DOCX/ZIP yang valid.
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11

    Conflict:
      description: The tenant has no active format rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noActiveRule:
              value:
                error:
                  code: NO_ACTIVE_RULE
                  message: Tenant belum memiliki rule format aktif.
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11

    PayloadTooLarge:
      description: Upload exceeds the configured maximum size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            fileTooLarge:
              value:
                error:
                  code: FILE_TOO_LARGE
                  message: Ukuran file melebihi batas 10 MB.
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11

    ServiceUnavailable:
      description: The pg-boss queue is not ready.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            queueUnavailable:
              value:
                error:
                  code: QUEUE_UNAVAILABLE
                  message: Antrean pemeriksaan belum siap.
                  request_id: 6f1c3b1e-3e2a-4f9a-9f0d-2f4b8c1a7d11
